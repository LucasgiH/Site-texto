<!DOCTYPE html>
<!-- forma lista link clicaveis -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Inicial - Redação FATEC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      padding: 20px;
    }
    .link-container {
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px; /* Espaço entre os itens da lista */
    }
    .responsive-link {
      display: block;
      background-color: #f8f9fa;
      padding: 12px 15px;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      color: #0056b3;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
      word-wrap: break-word;
      transition: all 0.3s ease;
      text-align: center;
    }
    .responsive-link:hover {
      background-color: #e9ecef;
      color: #003d82;
      border-color: #0056b3;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="link-container">
    <a href="redacao1.html" class="responsive-link">versao 1 redacao fatec 2024</a>
    <a href="questoes2.html" class="responsive-link">sequencia questoes 4/5 verde 261107</a>
    <a href="261108.html" class="responsive-link">sequencia questoes 1/4 vermelho 261108</a>
    <a href="261109.html" class="responsive-link">sequencia questoes 2/3 amarelo 261109</a>
    <a href="261111.html" class="responsive-link">sequencia questoes 4/4 verde 261111</a>
  </div>
</body>
</html>
