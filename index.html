<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Inicial - Redação FATEC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      padding: 20px;
    }
    .link-container {
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    .responsive-link {
      display: block;
      color: #0056b3;
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: none;
      word-wrap: break-word;
      transition: color 0.3s ease;
    }
    .responsive-link:hover {
      color: #003d82;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="link-container">
    <a href="redacao1.html" class="responsive-link">versao 1 redacao fatec 2024</a>
  </div>

</body>
</html>
